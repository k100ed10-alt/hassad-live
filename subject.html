<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المادة | حَصاد</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Tahoma,sans-serif;background:#f4eee0;color:#1a2428;padding:12px 12px 24px}
    header{background:#06262e;border-radius:16px;padding:8px;margin-bottom:12px;overflow-x:auto;white-space:nowrap}
    header a{color:#ead9a0;text-decoration:none;padding:8px 12px;display:inline-block;font-weight:700;border-radius:999px}
    header a.on{background:#0e5160;color:#fff}
    h1{font-size:24px;color:#0e5160;margin:4px 0 10px}
    .tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
    .tabs button{flex:0 0 auto;border:0;background:#fff;color:#0e5160;padding:10px 14px;border-radius:999px;font-weight:800}
    .tabs .on{background:#0e5160;color:#fff}
    .stage{background:#06262e;border-radius:22px;overflow:hidden;margin-bottom:12px}
    .player{position:relative;width:100%;padding-top:56.25%;background:#000}
    .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .wait{padding:48px 16px;text-align:center;color:#ead9a0}
    .chat{background:#fff;border-radius:18px;padding:14px;border:1px solid #e4d9bf}
    .bubble{background:#f4eee0;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px}
    .row{display:flex;gap:8px;margin-top:10px}
    .row input{flex:1;border:1.5px solid #e4d9bf;border-radius:999px;padding:12px 14px;background:#fbf8f1}
    .row button{background:#c9a227;border:0;border-radius:999px;padding:12px 16px;font-weight:800;color:#06262e}
    .card{background:#fff;border-radius:16px;padding:14px;margin-top:10px;border:1px solid #e4d9bf}
  </style>
</head>
<body>
  <header>
    <a href="home.html">الرئيسية</a>
    <a id="n-math" href="subject.html?id=math">رياضيات</a>
    <a id="n-islamic" href="subject.html?id=islamic">إسلامية</a>
    <a id="n-arabic" href="subject.html?id=arabic">عربية</a>
    <a id="n-science" href="subject.html?id=science">علوم</a>
  </header>
  <h1 id="title">المادة</h1>
  <div class="tabs">
    <button class="on" type="button" onclick="show('live',this)">البث</button>
    <button type="button" onclick="show('lessons',this)">الدروس</button>
    <button type="button" onclick="show('arch',this)">الأرشيف</button>
    <button type="button" onclick="show('hw',this)">الواجبات</button>
  </div>
  <section id="live">
    <div class="stage" id="stage"><div class="wait">المعلم لم يبدأ البث بعد</div></div>
    <div class="chat">
      <strong>اسأل المعلم</strong>
      <div id="bubbles"></div>
      <div class="row">
        <input id="chat-text" placeholder="اكتب سؤالك">
        <button type="button" onclick="send()">إرسال</button>
      </div>
    </div>
  </section>
  <section id="lessons" class="card" hidden><div id="lessons-list"></div></section>
  <section id="arch" class="card" hidden><div id="arch-list"></div></section>
  <section id="hw" class="card" hidden><div id="hw-list"></div></section>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=46"></script>
  <script src="js/fb.js?v=46"></script>
  <script>
    var names={math:"الرياضيات",islamic:"التربية الإسلامية",arabic:"اللغة العربية",science:"العلوم"};
    var id=new URLSearchParams(location.search).get("id")||"math";
    document.getElementById("title").textContent=names[id]||id;
    var n=document.getElementById("n-"+id); if(n) n.className="on";
    var u=null; try{u=JSON.parse(localStorage.getItem("hassad-user")||"null")}catch(e){}
    var myGrade=(u&&u.grade)||"";
    var playerSet=false;
    function sameGrade(item){
      if(!item) return false;
      if(item.subject_id && item.subject_id!==id) return false;
      if(!myGrade || !item.grade) return !item.grade || item.grade===myGrade;
      return item.grade===myGrade;
    }
    function ytId(src){
      var m=String(src||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|live\/|shorts\/)|v=)([\w-]{11})/);
      return m?m[1]:"";
    }
    function drawChat(rows){
      var box=document.getElementById("bubbles");
      box.innerHTML=rows.map(function(m){return '<div class="bubble"><b>'+(m.name||"")+'</b> '+(m.text||"")+'</div>';}).join("")||'<div class="bubble">اكتب سؤالك للمعلم</div>';
    }
    function loadChat(){
      if(!HassadFB.db) return;
      HassadFB.db.collection("messages").get().then(function(snap){
        var rows=[];
        snap.forEach(function(doc){
          var m=doc.data()||{};
          if(m.subject_id && m.subject_id!==id) return;
          if(myGrade && m.grade && m.grade!==myGrade) return;
          rows.push(m);
        });
        rows.sort(function(a,b){return (a.at||0)-(b.at||0);});
        drawChat(rows);
      });
    }
    function fill(){
      var data={}; try{data=JSON.parse(localStorage.getItem("hassad-db")||"{}")}catch(e){}
      var lives=(data.live_sessions||[]).filter(sameGrade);
      var live=lives.find(function(s){return s.stream_url && s.status!=="completed";}) || lives.find(function(s){return s.stream_url;});
      var stage=document.getElementById("stage");
      if(live && ytId(live.stream_url)){
        if(!playerSet){
          playerSet=true;
          var src="https://www.youtube.com/embed/"+ytId(live.stream_url)+"?playsinline=1&rel=0&modestbranding=1";
          stage.innerHTML='<div class="player"><iframe src="'+src+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen playsinline></iframe></div>';
        }
      } else {
        playerSet=false;
        stage.innerHTML='<div class="wait">لا بث لصفك الآن'+(myGrade?'<div style="margin-top:8px;opacity:.8">'+myGrade+'</div>':'')+'</div>';
      }
      document.getElementById("lessons-list").innerHTML=((data.lessons||[]).filter(sameGrade).map(function(l){return "<div class='card'><strong>"+l.title+"</strong><div>"+(l.note||"")+"</div></div>";}).join(""))||"لا دروس لصفك";
      document.getElementById("hw-list").innerHTML=((data.assignments||[]).filter(sameGrade).map(function(a){return "<div class='card'><strong>"+a.title+"</strong></div>";}).join(""))||"لا واجبات لصفك";
      document.getElementById("arch-list").textContent="لا تسجيلات بعد";
    }
    function send(){
      var t=document.getElementById("chat-text"); var text=(t.value||"").trim(); if(!text) return;
      var msg={id:"m"+Date.now(),subject_id:id,grade:myGrade,name:(u&&u.name)||"طالب",text:text,at:Date.now()};
      t.value="";
      HassadFB.put("messages", msg.id, msg).then(loadChat);
    }
    fill();
    HassadFB.init().then(function(){ HassadFB.pull().then(fill); loadChat(); });
    function show(name,btn){
      ["live","lessons","arch","hw"].forEach(function(x){document.getElementById(x).hidden=x!==name;});
      document.querySelectorAll(".tabs button").forEach(function(b){b.className="";});
      btn.className="on";
    }
  </script>
</body>
</html>
