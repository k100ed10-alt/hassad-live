<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة | حَصاد</title>
  <link rel="stylesheet" href="css/style.css?v=37" />
  <script>
    try{
      var _u=JSON.parse(localStorage.getItem("hassad-user")||"null");
      if(_u && _u.role==="teacher") location.replace("teacher.html");
    }catch(e){}
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="admin.html" style="color:#ead9a0">حَصاد · إدارة</a>
      <nav class="side-nav">
        <a class="active" href="admin.html">اللوحة</a>
        <a href="#" onclick="Hassad.logout()">خروج</a>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar"><h1>لوحة المدير</h1></div>
      <p class="hint" id="fb-status">جارٍ ربط السحابة...</p>
      <form class="card" style="margin-bottom:16px" onsubmit="event.preventDefault();localStorage.setItem('hassad-xai-key',document.getElementById('xai-key').value.trim());alert('حُفظ المفتاح');">
        <h3>مفتاح xAI</h3>
        <div class="field"><input id="xai-key" type="password" dir="ltr" placeholder="xai-..."></div>
        <button class="btn">حفظ المفتاح</button>
      </form>
      <form class="card" style="margin-bottom:16px" onsubmit="Hassad.createTeacher(event)">
        <h3>إنشاء معلم</h3>
        <p class="hint">المعلم يدخل برقم هاتفه — بلا بريد.</p>
        <div class="grid-2">
          <div class="field"><label>الاسم</label><input id="tc-name" required></div>
          <div class="field"><label>رقم الهاتف</label><input id="tc-phone" required inputmode="tel" placeholder="9689xxxxxxx"></div>
          <div class="field"><label>المادة</label><select id="tc-subject"></select></div>
          <div class="field"><label>الصف</label><select id="tc-grade"></select></div>
          <div class="field"><label>كلمة المرور المولَّدة</label><input id="tc-pass" readonly dir="ltr"></div>
        </div>
        <button class="btn">حفظ وولّد كلمة المرور</button>
        <p class="hint" id="tc-msg"></p>
      </form>
      <section class="card" style="margin-bottom:16px">
        <h3>المعلمون</h3>
        <table class="table"><thead><tr><th>الاسم</th><th>الهاتف</th><th>كلمة المرور</th><th>الصف</th></tr></thead><tbody id="teachers"></tbody></table>
      </section>
      <section class="card">
        <h3>الطلاب حسب الصف</h3>
        <div class="field"><label>اختر الصف</label>
          <select id="view-grade" onchange="Hassad.renderAdmin()"></select>
        </div>
        <p class="hint" id="grade-count"></p>
        <table class="table"><thead><tr><th>الاسم</th><th>الهاتف</th><th>البريد</th><th>كلمة المرور</th></tr></thead><tbody id="students"></tbody></table>
      </section>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=37"></script>
  <script src="js/fb.js?v=37"></script>
  <script src="js/app.js?v=37"></script>
  <script src="js/roles.js?v=37"></script>
  <script src="js/grade-filter.js?v=37"></script>
  <script>
    var grades=["الصف الخامس","الصف السادس","الصف السابع","الصف الثامن","الصف التاسع","الصف العاشر","الصف الحادي عشر","الصف الثاني عشر"];
    ["tc-grade","view-grade"].forEach(function(id){
      var el=document.getElementById(id); if(!el||el.options.length) return;
      grades.forEach(function(g){var o=document.createElement("option");o.textContent=g;el.appendChild(o)});
    });
    var ts=document.getElementById("tc-subject");
    if(ts && !ts.options.length){
      [["math","الرياضيات"],["islamic","الإسلامية"],["arabic","العربية"],["science","العلوم"]].forEach(function(p){var o=document.createElement("option");o.value=p[0];o.textContent=p[1];ts.appendChild(o)});
    }
    var xk=document.getElementById("xai-key"); if(xk) xk.value=localStorage.getItem("hassad-xai-key")||"";
    if(typeof fillGradeSelects==="function") fillGradeSelects();
    if(Hassad.renderAdmin) Hassad.renderAdmin();
    if(Hassad.renderTeachers) Hassad.renderTeachers();
    if(window.HassadFB){
      HassadFB.init().then(function(ok){
        var st=document.getElementById("fb-status");
        if(st) st.textContent=ok?"متصل بالسحابة":"لم يتم الاتصال بالسحابة";
        if(!ok) return;
        var data=JSON.parse(localStorage.getItem("hassad-db")||"{}");
        Object.keys(data.teachers||{}).forEach(function(id){ HassadFB.put("teachers", id, data.teachers[id]); });
        Object.keys(data.students||{}).forEach(function(id){ HassadFB.put("students", id, data.students[id]); });
        return HassadFB.pull();
      }).then(function(){
        if(Hassad.renderTeachers) Hassad.renderTeachers();
        if(Hassad.renderAdmin) Hassad.renderAdmin();
      });
    }
  </script>
</body>
</html>
