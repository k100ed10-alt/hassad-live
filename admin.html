<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة | حَصاد</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8" />
  <link rel="icon" href="assets/logo.svg">
  <style>
    input[type=checkbox]{width:20px;height:20px;accent-color:#0e5160}
    .del-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .del-bar .btn{background:#b42318;color:#fff}
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="admin.html" style="color:#ead9a0">
        <img src="assets/logo.svg" alt="" style="width:40px;height:50px;object-fit:contain;background:#fff;border-radius:8px"> حَصاد
      </a>
      <nav class="side-nav">
        <a class="active" href="admin.html">اللوحة</a>
        <a href="index.html">الموقع</a>
        <a href="#" onclick="Hassad.logout()">خروج</a>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar"><h1>لوحة التحكم</h1></div>
      <section class="card" data-admin-only style="margin-bottom:16px;background:#fff4d6;border:2px solid #c9a227">
        <h3 style="color:#7a4e00">مسح الكل</h3>
        <button type="button" class="btn" style="background:#b42318" onclick="clearHassadData()">مسح كل البيانات</button>
      </section>
      <form class="card" data-admin-only style="margin-bottom:16px" onsubmit="Hassad.createTeacher(event)">
        <h3 style="color:var(--teal-900);margin-bottom:10px">إنشاء معلم</h3>
        <div class="grid-2">
          <div class="field"><label>الاسم</label><input id="tc-name" required></div>
          <div class="field"><label>البريد</label><input id="tc-email" type="email" required></div>
          <div class="field"><label>كلمة المرور</label><input id="tc-pass" required minlength="6"></div>
          <div class="field"><label>المادة</label><select id="tc-subject"></select></div>
          <div class="field"><label>الصف</label><select id="tc-grade"></select></div>
        </div>
        <button class="btn">حفظ حساب المعلم</button>
        <p class="hint" id="tc-msg"></p>
      </form>
      <section class="card" data-admin-only style="margin-bottom:16px">
        <h3>إضافة دفعة طلاب</h3>
        <div class="field"><label>الصف</label><select id="bulk-grade"></select></div>
        <div class="field"><label>الأسماء</label><textarea id="bulk-names" rows="6"></textarea></div>
        <button type="button" class="btn" onclick="Hassad.bulkCreate()">أنشئ الحسابات</button>
        <button type="button" class="btn-outline" onclick="Hassad.exportStudents()">تحميل الكشف</button>
        <p class="hint" id="bulk-msg"></p>
      </section>
      <form class="card" data-admin-only style="margin-bottom:16px" onsubmit="Hassad.createStudent(event)">
        <h3>طالب واحد</h3>
        <div class="grid-2">
          <div class="field"><label>الاسم</label><input id="st-name" required></div>
          <div class="field"><label>الصف</label><select id="st-grade" required></select></div>
          <div class="field"><label>البريد</label><input id="st-email" type="email" required></div>
          <div class="field"><label>كلمة المرور</label><input id="st-pass" required minlength="6"></div>
        </div>
        <button type="button" class="btn-outline" onclick="document.getElementById('st-pass').value=Hassad.genPassword()">توليد</button>
        <button class="btn">حفظ</button>
        <p class="hint" id="new-cred"></p>
      </form>
      <div class="grid-2">
        <form class="card" onsubmit="Hassad.saveLive(event)">
          <h3>الحصة / StreamYard</h3>
          <div class="field"><label>المادة</label><select id="live-form-subject"></select></div>
          <div class="field"><label>الصف</label><select id="live-grade"></select></div>
          <div class="field"><label>العنوان</label><input id="live-title" required></div>
          <div class="field"><label>التاريخ</label><input id="live-date" type="date" required></div>
          <div class="field"><label>الوقت</label><input id="live-hour" type="time" required></div>
          <div class="field"><label>رابط البث (يوتيوب أو StreamYard)</label><input id="live-embed" dir="ltr" placeholder="https://www.youtube.com/embed/... أو رابط المشاهدة"></div>
          <div class="field"><label>رابط التسجيل بعد الحصة (الأرشيف)</label><input id="live-rec" dir="ltr" placeholder="https://youtube.com/watch?v=..."></div>
          <p class="hint">ضع رابط البث للمباشر؁ ورابط التسجيل لظهور الحصة في أرشيف المادة.</p>
          <button class="btn">نشر</button>
        </form>
        <form class="card" onsubmit="Hassad.saveHw(event)">
          <h3>الواجب</h3>
          <div class="field" data-admin-only><label>مفتاح xAI</label><input id="xai-key" type="password" dir="ltr"></div>
          <div class="field"><label>المادة</label><select id="hw-subject"></select></div>
          <div class="field"><label>الصف</label><select id="hw-grade"></select></div>
          <div class="field"><label>العنوان</label><input id="hw-title" required></div>
          <div class="field"><label>آخر موعد</label><input id="hw-due" type="date" required></div>
          <div class="field"><label>الصورة</label><input id="hw-image" type="file" accept="image/*"><img id="hw-preview" style="margin-top:8px;max-height:160px;display:none;border-radius:12px"></div>
          <button type="button" class="btn" onclick="Hassad.convertImage()">حوّل الصورة</button>
          <p class="hint" id="convert-msg"></p>
          <div class="field"><label>الأسئلة</label><textarea id="hw-questions" rows="6"></textarea></div>
          <button class="btn btn-gold">نشر</button>
        </form>
      </div>
      <section class="card" style="margin-top:16px">
        <div class="del-bar"><h3>الطلاب</h3>
          <div data-admin-only>
            <button type="button" class="btn-outline" onclick="Hassad.exportStudents()">الكشف</button>
            <button type="button" class="btn" onclick="Hassad.deleteSelected('student')">حذف المحدد</button>
          </div>
        </div>
        <table class="table"><thead><tr>
          <th data-admin-only><input type="checkbox" onclick="Hassad.toggleAll('student',this)"></th>
          <th>الاسم</th><th>البريد</th><th data-admin-only>كلمة المرور</th><th>الصف</th><th>الاشتراك</th>
        </tr></thead><tbody id="students"></tbody></table>
      </section>
      <section class="card" style="margin-top:16px">
        <div class="del-bar"><h3>الحصص</h3><button type="button" class="btn" data-admin-only onclick="Hassad.deleteSelected('live')">حذف المحدد</button></div>
        <table class="table"><thead><tr><th data-admin-only></th><th>المادة</th><th>العنوان</th><th>الوقت</th><th>الرابط</th></tr></thead><tbody id="live-table"></tbody></table>
      </section>
      <section class="card" style="margin-top:16px">
        <div class="del-bar"><h3>الواجبات</h3><button type="button" class="btn" data-admin-only onclick="Hassad.deleteSelected('hw')">حذف المحدد</button></div>
        <div class="list" id="admin-hw"></div>
      </section>
    </main>
  </div>
  <script src="js/app.js?v=8"></script>
  <script src="js/roles.js?v=8"></script>
  <script src="js/quiz.js?v=8"></script>
  <script src="js/vision.js?v=8"></script>
  <script src="js/admin-delete.js?v=8"></script>
  <script src="js/grade-filter.js?v=8"></script>
  <script src="js/bulk-students.js?v=8"></script>
  <script src="js/live-plus.js?v=8"></script>
  <script>
    function clearHassadData(){
      if(!confirm("مسح الكل؟")) return;
      const data=JSON.parse(localStorage.getItem("hassad-db")||"{}");
      data.students={};data.assignments=[];data.live_sessions=[];data.lessons=[];data.submissions={};
      localStorage.setItem("hassad-db",JSON.stringify(data)); location.reload();
    }
    Hassad.renderAdmin();
    const grades=["الصف الخامس","الصف السادس","الصف السابع","الصف الثامن","الصف التاسع","الصف العاشر"];
    ["bulk-grade","tc-grade"].forEach(id=>{
      const el=document.getElementById(id); if(!el||el.options.length) return;
      grades.forEach(g=>{const o=document.createElement("option");o.textContent=g;el.appendChild(o)});
    });
    const ts=document.getElementById("tc-subject");
    if(ts && !ts.options.length){
      [["math","الرياضيات"],["islamic","التربية الإسلامية"],["arabic","اللغة العربية"],["science","العلوم"]].forEach(([v,n])=>{const o=document.createElement("option");o.value=v;o.textContent=n;ts.appendChild(o)});
    }
    if(typeof fillGradeSelects==="function") fillGradeSelects();
    if(Hassad.applyRoleUI) Hassad.applyRoleUI();
    const saved=localStorage.getItem("hassad-xai-key");
    const keyEl=document.getElementById("xai-key"); if(saved&&keyEl) keyEl.value=saved;
    const imgIn=document.getElementById("hw-image");
    if(imgIn) imgIn.addEventListener("change",function(){
      const f=this.files[0],img=document.getElementById("hw-preview");
      if(!f){img.style.display="none";return;}
      const r=new FileReader(); r.onload=()=>{img.src=r.result;img.style.display="block"}; r.readAsDataURL(f);
    });
  </script>
</body>
</html>
