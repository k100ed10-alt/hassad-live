<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | حَصاد</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <img src="https://dummyimage.com/92x92/0b3d4a/ead9a0.png&text=%D8%AD" alt="حَصاد">
        <span>منصة حَصاد</span>
      </a>
      <a class="ghost-btn" href="index.html">العودة للرئيسية</a>
    </div>
  </nav>
  <div class="auth-wrap">
    <form class="auth-card" onsubmit="Hassad.loginHandler(event)">
      <img src="https://dummyimage.com/92x92/0b3d4a/ead9a0.png&text=%D8%AD" alt="" style="width:64px;height:64px;border-radius:18px;border:2px solid var(--gold-500)">
      <h1>دخول الطالب</h1>
      <p style="color:var(--muted);margin-bottom:18px">استخدم البريد وكلمة المرور الخاصة التي أعطاك إياها المعلم.</p>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" required placeholder="name@example.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" required placeholder="كلمة المرور الخاصة" autocomplete="current-password">
      </div>
      <p class="error" id="login-error"></p>
      <button class="btn" style="width:100%">دخول</button>
      <p class="hint">لا تشارك كلمة المرور مع زميلك. إذا نسيتها اطلب من المعلم إعادة تعيينها.</p>
    </form>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
