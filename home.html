<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>حَصاد</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Tahoma,sans-serif;background:#f4eee0;color:#1a2428;padding:16px}
    .gate{max-width:420px;margin:40px auto;background:#06262e;color:#fff;border-radius:20px;padding:24px;text-align:center}
    .gate a,.gate button{display:block;margin:10px 0;padding:12px;border-radius:12px;text-decoration:none;font-weight:800;border:0;width:100%}
    .go{background:#ead9a0;color:#06262e}
    .out{background:transparent;color:#ead9a0}
    header{background:#06262e;border-radius:16px;padding:8px;margin-bottom:12px;display:flex;align-items:center;gap:4px}
    header a,header button{color:#ead9a0;text-decoration:none;padding:8px 12px;display:inline-block;font-weight:700;border-radius:999px;border:0;background:transparent;font:inherit}
    header a.on{background:#0e5160;color:#fff}
    header .leave{margin-right:auto;color:#ffd6db}
    h1{font-size:22px;color:#0e5160;margin:4px 0 10px}
    .pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .pills span{padding:7px 12px;border-radius:999px;font-weight:800;font-size:14px}
    .p1{background:#fff3c4}.p2{background:#ffd6db}.p3{background:#d7eefe}
    .week{background:#0e5160;color:#fff;border-radius:18px;padding:14px;margin-bottom:12px}
    .slot{padding:10px 0;border-top:1px solid rgba(255,255,255,.18);font-size:14px}
    .subs{margin-bottom:12px}
    .sub{display:block;border-radius:18px;padding:18px;min-height:88px;text-decoration:none;color:#123;background:#dbeafe}
    .box{background:#fff;border:1px solid #e4d9bf;border-radius:18px;padding:14px;margin-bottom:12px}
    .rank{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #eee3cc}
    .rank b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#f4eee0}
    .gold b{background:#ead9a0}
    .me{background:#f7f1df;margin:0 -14px;padding:10px 14px;border-radius:12px}
    .bell{width:100%;margin:0 0 12px;background:#ead9a0;color:#06262e;border:0;border-radius:14px;padding:12px;font-weight:800}
    .soon{background:#fff3c4;border:1px solid #ead9a0;border-radius:14px;padding:12px;margin-bottom:12px;font-weight:700;display:none}
  </style>
</head>
<body>
  <div id="staff" style="display:none">
    <div class="gate">
      <h2>حساب الإدارة</h2>
      <a class="go" href="admin.html">ادخل لوحة التحكم</a>
      <button class="out" type="button" onclick="out()">خروج</button>
    </div>
  </div>
  <div id="student">
    <header>
      <a class="on" href="home.html">الرئيسية</a>
      <a href="subject.html?id=math">رياضيات</a>
      <button class="leave" type="button" onclick="out()">خروج</button>
    </header>
    <h1 id="hi">مرحباً</h1>
    <div class="pills">
      <span class="p1" id="pts">★ ٠ نقطة</span>
      <span class="p2" id="str">🔥 ٠ يوم</span>
      <span class="p3" id="gr"></span>
    </div>
    <button class="bell" id="bell-btn" type="button" onclick="enableBell()">فعّل تنبيه الحصة قبل ٢٠ دقيقة</button>
    <div class="soon" id="soon"></div>
    <div class="week"><strong>حصص الأسبوع</strong><div id="week"></div></div>
    <div class="subs">
      <a class="sub" href="subject.html?id=math"><strong>الرياضيات</strong><div>مفتوحة الآن</div></a>
    </div>
    <div class="box"><strong>متصدرو الصف</strong><div id="board"></div></div>
    <div class="box"><strong>واجبات صفك</strong><div id="hw"></div></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=57"></script>
  <script src="js/fb.js?v=57"></script>
  <script>
    function out(){ localStorage.removeItem("hassad-user"); location.href="login.html"; }
    function ar(n){return String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]});}
    function sessionAt(s){
      if(s && s.scheduled_at){ var t=Date.parse(s.scheduled_at); if(!isNaN(t)) return t; }
      return 0;
    }
    function ping(title, body){
      try{
        if(window.Notification && Notification.permission==="granted"){
          new Notification(title,{body:body,tag:"hassad-class"});
        }
      }catch(e){}
      var el=document.getElementById("soon");
      el.style.display="block";
      el.textContent=title+" — "+body;
    }
    function scheduleBells(sessions){
      var now=Date.now();
      sessions.forEach(function(s){
        var at=sessionAt(s); if(!at) return;
        var warn=at-20*60*1000;
        var key="bell_"+(s.id||at);
        if(localStorage.getItem(key)) return;
        if(warn<=now && now<at){
          localStorage.setItem(key,"1");
          ping("الحصة بعد قليل", (s.title||"حصة الرياضيات")+" · "+(s.scheduled_time||""));
        } else if(warn>now && warn-now<36*60*60*1000){
          setTimeout(function(){
            localStorage.setItem(key,"1");
            ping("بعد ٢٠ دقيقة حصة", (s.title||"حصة الرياضيات")+" · "+(s.scheduled_time||""));
          }, warn-now);
        }
      });
    }
    function enableBell(){
      var btn=document.getElementById("bell-btn");
      if(!window.Notification){ btn.textContent="المتصفح لا يدعم الإشعار"; return; }
      Notification.requestPermission().then(function(p){
        btn.textContent=p==="granted"?"التنبيه مفعّل قبل الحصة ب٢٠ دقيقة":"اسمح بالإشعار من إعدادات المتصفح";
        paint();
      });
    }
    function paint(){
      var u=null; try{u=JSON.parse(localStorage.getItem("hassad-user")||"null")}catch(e){}
      var role=(u&&u.role||"").toLowerCase();
      var mail=(u&&u.email||"").toLowerCase();
      var nm=(u&&u.name||"").toLowerCase();
      var staff=role==="admin"||role==="teacher"||mail.indexOf("admin@")===0||nm==="admin"||nm.indexOf("مدير")!==-1;
      if(staff){
        document.getElementById("student").style.display="none";
        document.getElementById("staff").style.display="block";
        return;
      }
      if(window.Notification && Notification.permission==="granted"){
        document.getElementById("bell-btn").textContent="التنبيه مفعّل قبل الحصة ب٢٠ دقيقة";
      }
      var data={}; try{data=JSON.parse(localStorage.getItem("hassad-db")||"{}")}catch(e){}
      data.students=data.students||{};
      var rec=u && data.students[u.uid];
      var myPts=rec?Number(rec.points)||0:0, myStreak=rec?Number(rec.streak)||0:0;
      if(u){ document.getElementById("hi").textContent="مرحباً "+(u.name||""); document.getElementById("gr").textContent=u.grade||""; }
      document.getElementById("pts").textContent="★ "+ar(myPts)+" نقطة";
      document.getElementById("str").textContent="🔥 "+ar(myStreak)+" يوم";
      var grade=u&&u.grade;
      var board=[];
      Object.keys(data.students).forEach(function(id){
        var s=data.students[id]; if(!s||!s.name) return;
        if(grade && s.grade && s.grade!==grade) return;
        board.push({name:s.name,pts:Number(s.points)||0,me:u&&(id===u.uid||s.email===u.email||s.phone===u.phone)});
      });
      if(u && !board.some(function(r){return r.me})) board.push({name:u.name,pts:myPts,me:true});
      board.sort(function(a,b){return b.pts-a.pts});
      document.getElementById("board").innerHTML=board.slice(0,8).map(function(r,i){
        return '<div class="rank '+(i===0?"gold":"")+(r.me?" me":"")+'"><span style="display:flex;gap:8px;align-items:center"><b>'+ar(i+1)+'</b> '+r.name+(r.me?" (أنت)":"")+'</span><span>★ '+ar(r.pts)+'</span></div>';
      }).join("") || '<div class="slot">لا نقاط بعد</div>';
      var sessions=(data.live_sessions||[]).filter(function(s){return (!s.subject_id||s.subject_id==="math") && (!grade||!s.grade||s.grade===grade);});
      document.getElementById("week").innerHTML=sessions.length?sessions.map(function(s){return '<div class="slot">'+s.title+(s.scheduled_time?" — "+s.scheduled_time:"")+'</div>';}).join(""):'<div class="slot">لا حصص هذا الأسبوع</div>';
      var hws=(data.assignments||[]).filter(function(a){return (!a.subject_id||a.subject_id==="math") && (!grade||!a.grade||a.grade===grade);});
      document.getElementById("hw").innerHTML=hws.length?hws.map(function(a){return '<div class="slot"><a href="subject.html?id=math">'+a.title+'</a></div>';}).join(""):'<div class="slot">لا واجبات جديدة</div>';
      scheduleBells(sessions);
    }
    paint();
    if(window.HassadFB){ HassadFB.init().then(function(ok){ if(!ok) return; return HassadFB.pull(); }).then(function(){ paint(); }); }
  </script>
</body>
</html>
