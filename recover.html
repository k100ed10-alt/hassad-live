<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>استعادة | حَصاد</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Tahoma,sans-serif;background:#f4eee0;color:#1a2428}
    .wrap{max-width:420px;margin:40px auto;padding:16px}
    .card{background:#fff;border:1px solid #e4d9bf;border-radius:18px;padding:20px}
    h1{font-size:22px;color:#0e5160;margin:0 0 8px}
    p{color:#5c6b70;font-size:14px;line-height:1.6}
    label{display:block;font-weight:700;margin:12px 0 6px}
    input{width:100%;padding:12px;border:1px solid #d9d0bc;border-radius:12px;font:inherit}
    button{width:100%;margin-top:14px;background:#0e5160;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800}
    .box{margin-top:14px;background:#06262e;color:#fff;border-radius:12px;padding:14px;display:none}
    .box b{display:block;margin:4px 0 8px;word-break:break-all;direction:ltr}
    .copy{width:auto;background:#ead9a0;color:#06262e;padding:6px 10px;border-radius:8px}
    a{color:#0e5160}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>كلمة مرور موحدة</h1>
      <p>إذا كان الحساب في السحابة نظهره. إن لم يكن ننشئه هنا ليعمل في كل المتصفحات.</p>
      <label>رقم الهاتف</label>
      <input id="phone" inputmode="tel" placeholder="97787130">
      <button type="button" onclick="go()">اظهر / أنشئ في السحابة</button>
      <p id="err" style="color:#b42318"></p>
      <div class="box" id="box">
        <div>البريد</div><b id="em"></b>
        <div>كلمة المرور لكل الأجهزة</div><b id="pw"></b>
        <button class="copy" type="button" onclick="cp()">نسخ الكلمة</button>
        <p style="color:#ead9a0"><a href="login.html" style="color:#ead9a0">ادخل الآن</a></p>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=53"></script>
  <script src="js/fb.js?v=53"></script>
  <script>
    function digits(s){return String(s||"").replace(/[^0-9]/g,"");}
    function norm(raw){
      var d=digits(raw);
      if(d.indexOf("00968")===0) d=d.slice(2);
      if(d.indexOf("968")===0 && d.length>=11) return d.slice(0,11);
      if(d.length===8 && /^[79]/.test(d)) return "968"+d;
      return d;
    }
    function matchPhone(a,b){
      var x=digits(a), y=digits(b);
      return x && y && (x===y || x.slice(-8)===y.slice(-8));
    }
    function gen(){var a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";var s="Hs-";for(var i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
    function cp(){
      var t=document.getElementById("pw").textContent;
      if(navigator.clipboard) navigator.clipboard.writeText(t);
    }
    function show(email, pass){
      document.getElementById("em").textContent=email;
      document.getElementById("pw").textContent=pass;
      document.getElementById("box").style.display="block";
    }
    function go(){
      var phone=norm(document.getElementById("phone").value);
      var err=document.getElementById("err"); err.textContent="";
      document.getElementById("box").style.display="none";
      if(!phone || phone.length<8){ err.textContent="اكتب رقم الهاتف"; return; }
      var uid="phone_"+phone;
      var email="s"+phone+"@hassad.om";
      err.textContent="جارٍ الربط بالسحابة...";
      HassadFB.init().then(function(){
        return HassadFB.db.collection("students").get();
      }).then(function(snap){
        var found=null;
        snap.forEach(function(doc){
          var s=Object.assign({id:doc.id}, doc.data());
          if(matchPhone(s.phone||doc.id, phone)) found=s;
        });
        if(found && found.password){
          err.textContent="";
          show(found.email||email, found.password);
          return;
        }
        var rec={name:found&&found.name||"طالب",phone:phone,email:email,password:gen(),grade:(found&&found.grade)||"الصف الخامس",subscription_status:"active",points:0,streak:0};
        return HassadFB.put("students", uid, rec).then(function(){
          err.textContent="";
          show(email, rec.password);
        });
      }).catch(function(e){ err.textContent="تعذّر الحفظ. تأكد من Authorized domains وAnonymous. "+(e&&e.message||""); });
    }
  </script>
</body>
</html>
