<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إنشاء حساب | حَصاد</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Tahoma,sans-serif;background:#f4eee0;color:#1a2428;min-height:100vh;padding:20px}
    .wrap{max-width:420px;margin:0 auto}
    .logo{text-align:center;margin:12px 0 18px;text-decoration:none;display:block}
    .logo b{display:block;font-size:22px;color:#0e5160;margin-top:6px}
    .card{background:#fff;border:1px solid #e4d9bf;border-radius:20px;padding:20px}
    h1{font-size:20px;color:#0e5160;margin-bottom:6px}
    .hint{color:#5c6b70;font-size:13px;margin-bottom:14px;line-height:1.6}
    label{display:block;font-weight:700;margin:10px 0 6px;font-size:14px}
    input,select{width:100%;padding:12px;border:1px solid #d9d0bc;border-radius:12px;font-size:16px;background:#fff}
    .btn{width:100%;margin-top:14px;background:#0e5160;color:#fff;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:16px}
    .err{color:#b42318;margin-top:10px;font-weight:700;min-height:18px}
    .ok{display:none;background:#06262e;color:#fff;border-radius:20px;padding:20px;margin-top:14px}
    .ok h2{color:#ead9a0;margin-bottom:8px;font-size:18px}
    .row{background:#0e5160;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .row span{font-size:13px;opacity:.8}
    .row b{font-family:ui-monospace,monospace;direction:ltr}
    a{color:#0e5160;font-weight:800}
    .links{text-align:center;margin-top:16px}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="logo" href="index.html">
      <img src="assets/logo.svg" alt="حَصاد" width="72" height="90" style="object-fit:contain">
      <b>منصة حَصاد</b>
    </a>
    <form class="card" id="form">
      <h1>أنشئ حسابك</h1>
      <p class="hint">اكتب اسمك ورقم هاتفك وصفك. الصفحة تولّد البريد وكلمة المرور وتربطهما برقمك.</p>
      <label>الاسم الثلاثي</label>
      <input id="name" required placeholder="مثل: يوسف العلوي">
      <label>رقم الهاتف</label>
      <input id="phone" required inputmode="tel" placeholder="9689xxxxxxx أو 9xxxxxxx">
      <label>الصف</label>
      <select id="grade" required>
        <option value="">اختر الصف</option>
        <option>الصف الخامس</option>
        <option>الصف السادس</option>
        <option>الصف السابع</option>
        <option>الصف الثامن</option>
        <option>الصف التاسع</option>
        <option>الصف العاشر</option>
        <option>الصف الحادي عشر</option>
        <option>الصف الثاني عشر</option>
      </select>
      <button class="btn" type="submit">ولّد بريدي وكلمة مروري</button>
      <p class="err" id="err"></p>
    </form>
    <div class="ok" id="ok">
      <h2>تم إنشاء حسابك</h2>
      <p class="hint" style="color:#ead9a0">احفظ هذه البيانات. الدخول بعدها برقم الهاتف.</p>
      <div class="row"><span>الهاتف</span><b id="o-phone"></b></div>
      <div class="row"><span>البريد</span><b id="o-email"></b></div>
      <div class="row"><span>كلمة المرور</span><b id="o-pass"></b></div>
      <a class="btn" href="login.html" style="display:block;text-align:center;text-decoration:none;margin-top:12px">ادخل الآن</a>
    </div>
    <p class="links"><a href="login.html">عندي حساب مسبقاً</a></p>
  </div>
  <script src="js/register.js?v=24"></script>
</body>
</html>
