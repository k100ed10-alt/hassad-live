<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المعلم | حَصاد</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="admin.html" style="color:#ead9a0">
        <img src="https://dummyimage.com/92x92/0b3d4a/ead9a0.png&text=%D8%AD" alt="">
        إدارة حَصاد
      </a>
      <nav class="side-nav">
        <a class="active" href="admin.html">لوحة التحكم</a>
        <a href="index.html">الموقع العام</a>
        <a href="#" onclick="Hassad.logout()">خروج</a>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <h1>لوحة المعلم والإدارة</h1>
          <p style="color:var(--muted)">أضف واجباً أو حدّث رابط البث لينعكس فوراً في شاشات الطلاب.</p>
        </div>
        <div class="user-chip">
          <div class="avatar">م</div>
          <div><strong>صلاحيات معلم</strong><div style="font-size:12px;color:var(--muted)">teacher@hassad.om</div></div>
        </div>
      </div>
      <div class="grid-2">
        <form class="card" onsubmit="Hassad.saveLive(event)">
          <h3 style="margin-bottom:12px;color:var(--teal-900)">تحديث الحصة المباشرة</h3>
          <div class="field"><label>المادة</label><select id="live-form-subject"></select></div>
          <div class="field"><label>عنوان الحصة</label><input id="live-title" required placeholder="حصة المعادلات"></div>
          <div class="field"><label>موعد البث</label><input id="live-time" required placeholder="الخميس 8:00 م"></div>
          <div class="field"><label>رابط تضمين يوتيوب</label><input id="live-embed" placeholder="https://www.youtube.com/embed/XXXX"></div>
          <button class="btn">حفظ ونشر للطلاب</button>
        </form>
        <form class="card" onsubmit="Hassad.saveHw(event)">
          <h3 style="margin-bottom:12px;color:var(--teal-900)">إضافة واجب جديد</h3>
          <div class="field"><label>المادة</label><select id="hw-subject"></select></div>
          <div class="field"><label>عنوان الواجب</label><input id="hw-title" required></div>
          <div class="field"><label>تاريخ التسليم</label><input id="hw-due" type="date" required></div>
          <button class="btn btn-gold">نشر الواجب</button>
        </form>
      </div>
      <section class="card" style="margin-top:16px">
        <h3 style="margin-bottom:12px;color:var(--teal-900)">جدول الحصص</h3>
        <table class="table"><thead><tr><th>المادة</th><th>العنوان</th><th>الوقت</th><th>الرابط</th></tr></thead><tbody id="live-table"></tbody></table>
      </section>
      <div class="grid-2" style="margin-top:16px">
        <section class="card"><h3 style="margin-bottom:12px;color:var(--teal-900)">الواجبات</h3><div class="list" id="admin-hw"></div></section>
        <section class="card"><h3 style="margin-bottom:12px;color:var(--teal-900)">الطلاب</h3><table class="table"><thead><tr><th>الاسم</th><th>البريد</th><th>الصف</th><th>الاشتراك</th></tr></thead><tbody id="students"></tbody></table></section>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script>Hassad.renderAdmin();</script>
</body>
</html>
