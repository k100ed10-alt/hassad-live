<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | حَصاد</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <img src="https://dummyimage.com/92x92/0b3d4a/ead9a0.png&text=%D8%AD" alt="حَصاد">
        <span>منصة حَصاد</span>
      </a>
      <a class="ghost-btn" href="index.html">العودة للرئيسية</a>
    </div>
  </nav>
  <div class="auth-wrap">
    <form class="auth-card" onsubmit="Hassad.loginHandler(event)">
      <img src="https://dummyimage.com/92x92/0b3d4a/ead9a0.png&text=%D8%AD" alt="" style="width:64px;height:64px;border-radius:18px;border:2px solid var(--gold-500)">
      <h1 id="login-title">دخول الطالب</h1>
      <p id="login-sub" style="color:var(--muted);margin-bottom:18px">اكتب البريد وكلمة المرور الخاصة.</p>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" required autocomplete="current-password">
      </div>
      <p class="error" id="login-error"></p>
      <button class="btn" style="width:100%">دخول</button>
      <p class="hint" id="login-hint"></p>
    </form>
  </div>
  <script src="js/app.js"></script>
  <script>
    (function(){
      var as = new URLSearchParams(location.search).get("as");
      if (as === "teacher") {
        localStorage.removeItem("hassad-user");
        document.getElementById("login-title").textContent = "دخول المعلم";
        document.getElementById("login-sub").textContent = "ادخل بحساب المعلم لإنشاء الطلاب ونشر الحصص.";
        document.getElementById("email").value = "teacher@hassad.om";
        document.getElementById("password").value = "Teacher#1";
        document.getElementById("login-hint").textContent = "حساب المعلم جاهز. اضغط دخول.";
      }
    })();
  </script>
</body>
</html>
