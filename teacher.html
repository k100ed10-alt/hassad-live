<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة المعلم | حَصاد</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Tahoma,sans-serif;background:#f4eee0;color:#1a2428;padding:16px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    h1{font-size:22px;color:#0e5160}
    button,input,select,textarea{font:inherit}
    .out{background:transparent;border:0;color:#0e5160;font-weight:800}
    .card{background:#fff;border:1px solid #e4d9bf;border-radius:18px;padding:16px;margin-bottom:14px}
    label{display:block;font-weight:700;margin:10px 0 6px;font-size:14px}
    input,select,textarea{width:100%;padding:11px;border:1px solid #d9d0bc;border-radius:12px;background:#fff}
    .btn{width:100%;margin-top:12px;background:#0e5160;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800}
    .slot{padding:10px 0;border-top:1px solid #eee3cc;font-size:14px}
    .muted{color:#5c6b70;font-size:13px;margin-bottom:10px}
    #hw-preview{display:none;width:100%;border-radius:12px;margin-top:8px;max-height:220px;object-fit:contain;background:#faf6ea}
  </style>
</head>
<body>
  <header>
    <h1 id="hi">لوحة المعلم</h1>
    <button class="out" type="button" onclick="localStorage.removeItem('hassad-user');location.href='index.html'">خروج</button>
  </header>
  <p class="muted" id="meta"></p>
  <form class="card" id="live-form">
    <h3>إضافة حصة</h3>
    <label>لأي صف؟</label><select id="live-grade"></select>
    <label>العنوان</label><input id="live-title" required>
    <label>التاريخ</label><input id="live-date" type="date" required>
    <label>الوقت</label><input id="live-hour" type="time" required>
    <label>رابط البث</label><input id="live-embed" dir="ltr">
    <button class="btn">نشر الحصة لهذا الصف</button>
  </form>
  <form class="card" id="hw-form">
    <h3>إضافة واجب تفاعلي</h3>
    <label>لأي صف؟</label><select id="hw-grade"></select>
    <label>العنوان</label><input id="hw-title" required>
    <label>صورة الواجب</label>
    <input id="hw-file" type="file" accept="image/*">
    <img id="hw-preview" alt="">
    <label>موضوع</label>
    <textarea id="hw-topic" rows="3"></textarea>
    <label>آخر موعد</label><input id="hw-due" type="date" required>
    <p class="muted" id="hw-status">اختر الصف ثم انشر</p>
    <button class="btn">حوّل وانشر لهذا الصف</button>
  </form>
  <div class="card"><h3>جدولي</h3><div id="sched"></div></div>
  <div class="card"><h3>واجباتي</h3><div id="myhw"></div></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=38"></script>
  <script src="js/fb.js?v=38"></script>
  <script>
    var NAMES={math:"الرياضيات",islamic:"الإسلامية",arabic:"العربية",science:"العلوم"};
    var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    var u=null; try{u=JSON.parse(localStorage.getItem("hassad-user")||"null")}catch(e){}
    if(!u) location.href="login.html?as=teacher";
    else if(u.role==="admin") location.href="admin.html";
    else if(u.role!=="teacher") location.href="home.html";
    var myGrades=(u.grades&&u.grades.length)?u.grades:(u.grade?[u.grade]:["الصف الخامس"]);
    ["live-grade","hw-grade"].forEach(function(id){
      var el=document.getElementById(id);
      myGrades.forEach(function(g){ var o=document.createElement("option"); o.textContent=g; o.value=g; el.appendChild(o); });
    });
    var imgData="";
    function db(){ var d={}; try{d=JSON.parse(localStorage.getItem("hassad-db")||"{}")}catch(e){} d.live_sessions=d.live_sessions||[]; d.assignments=d.assignments||[]; return d; }
    function save(d){ localStorage.setItem("hassad-db", JSON.stringify(d)); }
    function cloud(col,item){
      if(!window.HassadFB) return;
      var copy=Object.assign({},item);
      if(copy.image && copy.image.length>750000) copy.image="";
      HassadFB.init().then(function(){ return HassadFB.put(col, item.id, copy); });
    }
    function when(date,hour){
      if(!date) return hour||"";
      var p=date.split("-").map(Number); var dt=new Date(p[0],p[1]-1,p[2]); var clock=hour||"";
      if(hour && hour.indexOf(":")>=0){ var hh=+hour.split(":")[0], mm=hour.split(":")[1]; var ap=hh>=12?"مساء":"صباح"; hh=hh%12||12; clock=hh+":"+mm+" "+ap; }
      return DAYS[dt.getDay()]+" "+p[2]+"/"+p[1]+" — "+clock;
    }
    function mine(list){
      return (list||[]).filter(function(s){
        if(u.subject_id && s.subject_id && s.subject_id!==u.subject_id) return false;
        if(s.grade && myGrades.indexOf(s.grade)===-1) return false;
        return true;
      });
    }
    function draw(){
      document.getElementById("hi").textContent="مرحباً "+(u.name||"");
      document.getElementById("meta").textContent=(NAMES[u.subject_id]||"")+" · "+myGrades.join(" · ");
      var d=db();
      document.getElementById("sched").innerHTML=mine(d.live_sessions).map(function(s){return '<div class="slot">'+s.title+' — '+(s.grade||"")+' — '+(s.scheduled_time||"")+'</div>';}).join("")||'<div class="slot">لا حصص</div>';
      document.getElementById("myhw").innerHTML=mine(d.assignments).map(function(s){return '<div class="slot">'+s.title+' — '+(s.grade||"")+'</div>';}).join("")||'<div class="slot">لا واجبات</div>';
    }
    function compress(file){
      return new Promise(function(resolve){
        var r=new FileReader();
        r.onload=function(){
          var im=new Image();
          im.onload=function(){
            var c=document.createElement("canvas"); var w=im.width,h=im.height,max=800;
            if(w>max){h=Math.round(h*max/w);w=max;} c.width=w;c.height=h;
            c.getContext("2d").drawImage(im,0,0,w,h); resolve(c.toDataURL("image/jpeg",0.65));
          }; im.src=r.result;
        }; r.readAsDataURL(file);
      });
    }
    document.getElementById("hw-file").onchange=async function(){
      var f=this.files&&this.files[0]; if(!f) return;
      imgData=await compress(f);
      var p=document.getElementById("hw-preview"); p.src=imgData; p.style.display="block";
    };
    document.getElementById("live-form").onsubmit=function(e){
      e.preventDefault(); var d=db();
      var g=document.getElementById("live-grade").value;
      var item={id:"l"+Date.now(),title:document.getElementById("live-title").value,subject_id:u.subject_id||"math",grade:g,stream_url:document.getElementById("live-embed").value.trim(),scheduled_time:when(document.getElementById("live-date").value,document.getElementById("live-hour").value),status:"upcoming",teacher:u.name};
      d.live_sessions.unshift(item); save(d); cloud("live_sessions", item); e.target.reset(); draw();
    };
    document.getElementById("hw-form").onsubmit=function(e){
      e.preventDefault();
      var title=document.getElementById("hw-title").value.trim();
      var topic=document.getElementById("hw-topic").value.trim();
      var g=document.getElementById("hw-grade").value;
      var item={id:"a"+Date.now(),subject_id:u.subject_id||"math",grade:g,title:title,topic:topic,image:imgData||"",due_date:document.getElementById("hw-due").value,created_at:new Date().toISOString().slice(0,10),questions:[{q:"ما موضوع الورقة؟",opts:[topic||title,"موضوع آخر","لا أعرف"],ok:0},{q:"كم نقطة للإجابة الصحيحة؟",opts:["10","1","0"],ok:0}],points_each:10,teacher:u.name};
      var d=db(); d.assignments.unshift(item); save(d); cloud("assignments", item);
      document.getElementById("hw-status").textContent="نُشر لطلاب "+g;
      e.target.reset(); imgData=""; document.getElementById("hw-preview").style.display="none"; draw();
    };
    draw();
    if(window.HassadFB) HassadFB.init().then(function(ok){ if(ok) return HassadFB.pull(); }).then(function(){ draw(); });
  </script>
</body>
</html>
