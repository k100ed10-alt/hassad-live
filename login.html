<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دخول | حَصاد</title>
  <link rel="stylesheet" href="css/style.css?v=39" />
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html"><span>منصة حَصاد</span></a>
      <a class="ghost-btn" href="register.html">طالب جديد</a>
    </div>
  </nav>
  <div class="auth-wrap">
    <form class="auth-card" onsubmit="Hassad.loginHandler(event)">
      <img src="assets/logo.svg" alt="حَصاد" style="width:88px;height:112px;object-fit:contain;margin:0 auto 8px">
      <h1 id="ttl">دخول الطالب</h1>
      <p id="sub" style="color:var(--muted);margin-bottom:18px">اكتب رقم هاتفك وكلمة المرور</p>
      <div class="field"><label id="lab">رقم الهاتف</label><input id="email" required inputmode="tel" placeholder="9689xxxxxxx" autocomplete="username"></div>
      <div class="field"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"></div>
      <p class="error" id="login-error"></p>
      <button class="btn" style="width:100%">دخول</button>
      <p class="hint" id="hint"><a href="recover.html">نسيت كلمة المرور؟</a> · <a href="register.html">طالب جديد</a></p>
    </form>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=39"></script>
  <script src="js/fb.js?v=39"></script>
  <script src="js/app.js?v=39"></script>
  <script src="js/roles.js?v=39"></script>
  <script>
    var as=new URLSearchParams(location.search).get("as");
    if(as==="teacher"){
      document.getElementById("ttl").textContent="دخول المعلم";
      document.getElementById("sub").textContent="اكتب رقم هاتفك وكلمة المرور. لا حاجة للبريد.";
      document.getElementById("lab").textContent="رقم هاتف المعلم";
      document.getElementById("hint").innerHTML="";
    }
    if(as==="admin"){
      document.getElementById("ttl").textContent="دخول المدير";
      document.getElementById("lab").textContent="البريد";
      document.getElementById("email").type="email";
      document.getElementById("email").value="admin@hassad.om";
      document.getElementById("hint").innerHTML="";
    }
  </script>
</body>
</html>
