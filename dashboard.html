<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>لوحة الطالب | حَصاد</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=12" />
  <link rel="stylesheet" href="css/student.css?v=12" />
  <link rel="stylesheet" href="css/live.css?v=12" />
  <link rel="icon" href="assets/logo.svg">
  <style>
    html{scroll-behavior:auto !important;overflow-x:hidden !important;height:auto !important}
    body{overflow-x:hidden !important;min-height:0 !important;width:100% !important}
    *{animation:none !important;transition:none !important}
    .app-shell{min-height:0 !important;width:100% !important;grid-template-columns:1fr !important;overflow-x:hidden !important}
    .grid-2{grid-template-columns:1fr !important}
    .user-chip{max-width:calc(100vw - 24px)}
    .path-wrap{display:none !important}
    .countdown{min-height:64px}
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html" style="color:#ead9a0">
        <img src="assets/logo.svg" alt="" style="width:40px;height:50px;object-fit:contain;background:#fff;border-radius:8px"> حَصاد
      </a>
      <nav class="side-nav">
        <a class="active" href="dashboard.html"><span>لوحة المواد</span></a>
        <a href="subject.html?id=math"><span>الرياضيات</span></a>
        <a href="subject.html?id=islamic"><span>الإسلامية</span></a>
        <a href="subject.html?id=arabic"><span>العربية</span></a>
        <a href="subject.html?id=science"><span>العلوم</span></a>
        <a href="#" onclick="Hassad.logout()"><span>خروج</span></a>
      </nav>
    </aside>
    <main class="main">
      <p style="font-size:11px;color:#888;margin:0 0 8px">إصدار 12 — بدون اهتزاز</p>
      <div class="topbar">
        <div>
          <h1 id="welcome">مرحباً</h1>
          <div class="stat-row">
            <span class="pill" id="points-pill">★ ٠ نقطة</span>
            <span class="pill" id="streak-pill">🔥 ٠ أيام</span>
            <span class="pill" id="grade-pill"></span>
          </div>
        </div>
      </div>
      <div id="class-countdown" class="countdown"><strong>لا حصة قادمة</strong></div>
      <div id="live-banner" class="live-banner">
        <div><strong>بث مباشر الآن</strong><div id="live-banner-text"></div></div>
        <a class="btn btn-gold" id="live-banner-btn" href="#">انضم</a>
      </div>
      <a class="continue-card" id="continue-card" href="subject.html?id=math">
        <div class="continue-top">
          <div><div style="font-size:12px;color:var(--muted);font-weight:800">استئناف التعلم</div><strong id="continue-title">آخر درس</strong></div>
          <span class="badge badge-soon" id="continue-pct">٠٪</span>
        </div>
        <div class="bar"><span id="continue-bar" style="width:0%"></span></div>
      </a>
      <h3 style="margin:0 0 10px;color:var(--teal-900)">المواد</h3>
      <div class="subjects-grid" id="subject-grid"></div>
      <section class="card" style="margin-top:16px"><h3 style="margin-bottom:12px;color:var(--teal-900)">واجبات صفك</h3><div class="list" id="assignment-list"></div></section>
      <section class="challenge" id="challenge" style="margin-top:16px">
        <h3 style="color:var(--teal-900);margin-bottom:8px">تحدي اليوم</h3>
        <p id="challenge-q" style="font-weight:700"></p>
        <div class="list" id="challenge-opts"></div>
        <p class="hint" id="challenge-msg"></p>
      </section>
    </main>
  </div>
  <script src="js/app.js?v=12"></script>
  <script src="js/roles.js?v=12"></script>
  <script src="js/student-ui.js?v=12"></script>
  <script src="js/quiz.js?v=12"></script>
  <script src="js/grade-filter.js?v=12"></script>
  <script src="js/live-plus.js?v=12"></script>
  <script>
    Hassad.renderDashboard();
    const u=Hassad.currentUser();
    if(u){
      const g=document.getElementById("grade-pill"); if(g) g.textContent=u.grade||"";
    }
    if(Hassad.renderCountdown) Hassad.renderCountdown();
  </script>
</body>
</html>
