<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المادة | حَصاد</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Tahoma,sans-serif;background:#f4eee0;color:#1a2428;padding:12px 12px 24px}
    header{background:#06262e;border-radius:16px;padding:8px;margin-bottom:12px;overflow-x:auto;white-space:nowrap}
    header a{color:#ead9a0;text-decoration:none;padding:8px 12px;display:inline-block;font-weight:700;border-radius:999px}
    header a.on{background:#0e5160;color:#fff}
    h1{font-size:24px;color:#0e5160;margin:4px 0 4px}
    .tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
    .tabs button{flex:0 0 auto;border:0;background:#fff;color:#0e5160;padding:10px 14px;border-radius:999px;font-weight:800}
    .tabs .on{background:#0e5160;color:#fff}
    .stage{background:linear-gradient(180deg,#0b3d4a,#06262e);border-radius:22px;min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;color:#ead9a0;padding:24px;margin-bottom:12px}
    .stage iframe{width:100%;min-height:220px;border:0;border-radius:18px}
    .dot{width:14px;height:14px;border-radius:50%;background:#ead9a0;display:inline-block;margin-left:6px}
    .chat{background:#fff;border-radius:18px;padding:14px;border:1px solid #e4d9bf}
    .bubble{background:#f4eee0;border-radius:14px 14px 4px 14px;padding:10px 12px;margin:8px 0;font-size:14px}
    .row{display:flex;gap:8px;margin-top:10px}
    .row input{flex:1;border:1.5px solid #e4d9bf;border-radius:999px;padding:12px 14px;background:#fbf8f1}
    .row button{background:#c9a227;border:0;border-radius:999px;padding:12px 16px;font-weight:800;color:#06262e}
    .card{background:#fff;border-radius:16px;padding:14px;margin-top:10px;border:1px solid #e4d9bf}
  </style>
</head>
<body>
  <header>
    <a href="home.html">الرئيسية</a>
    <a id="n-math" href="subject.html?id=math">رياضيات</a>
    <a id="n-islamic" href="subject.html?id=islamic">إسلامية</a>
    <a id="n-arabic" href="subject.html?id=arabic">عربية</a>
    <a id="n-science" href="subject.html?id=science">علوم</a>
  </header>
  <h1 id="title">المادة</h1>
  <div class="tabs">
    <button class="on" type="button" onclick="show('live',this)">البث</button>
    <button type="button" onclick="show('lessons',this)">الدروس</button>
    <button type="button" onclick="show('arch',this)">الأرشيف</button>
    <button type="button" onclick="show('hw',this)">الواجبات</button>
  </div>
  <section id="live">
    <div class="stage" id="stage">
      <div>
        <span class="dot"></span>
        <h2 style="margin:8px 0">المعلم لم يبدأ البث بعد</h2>
        <p id="next">عندما يُنشر الرابط سيظهر الفيديو هنا</p>
      </div>
    </div>
    <div class="chat">
      <strong>اسأل المعلم</strong>
      <div class="bubble">مرحباً — اكتب سؤالك</div>
      <div class="row">
        <input id="chat-text" placeholder="مثال: لم أفهم هذه الفكرة...">
        <button type="button" onclick="send()">إرسال</button>
      </div>
    </div>
  </section>
  <section id="lessons" class="card" hidden><div id="lessons-list"></div></section>
  <section id="arch" class="card" hidden><div id="arch-list"></div></section>
  <section id="hw" class="card" hidden><div id="hw-list"></div></section>
  <div id="quiz-box" class="card" style="display:none"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=41"></script>
  <script src="js/fb.js?v=41"></script>
  <script src="js/app.js?v=41"></script>
  <script src="js/quiz.js?v=41"></script>
  <script>
    var names={math:"الرياضيات",islamic:"التربية الإسلامية",arabic:"اللغة العربية",science:"العلوم"};
    var id=new URLSearchParams(location.search).get("id")||"math";
    document.getElementById("title").textContent=names[id]||id;
    var n=document.getElementById("n-"+id); if(n) n.className="on";
    var u=null; try{u=JSON.parse(localStorage.getItem("hassad-user")||"null")}catch(e){}
    function embed(src){
      var m=String(src||"").match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
      return m ? "https://www.youtube.com/embed/"+m[1] : src;
    }
    function fill(){
      var data={}; try{data=JSON.parse(localStorage.getItem("hassad-db")||"{}")}catch(e){}
      var lives=(data.live_sessions||[]).filter(function(s){ return !s.subject_id || s.subject_id===id; });
      var live=lives.find(function(s){return s.stream_url && s.status!=="completed";}) || lives.find(function(s){return s.stream_url;});
      var next=lives[0];
      if(next) document.getElementById("next").textContent=(next.title||"حصة")+" — "+(next.scheduled_time||"")+(next.grade?" · "+next.grade:"");
      if(live&&live.stream_url){
        document.getElementById("stage").innerHTML='<iframe src="'+embed(live.stream_url)+'" allowfullscreen></iframe>';
      }
      document.getElementById("lessons-list").innerHTML=((data.lessons||[]).filter(function(l){return l.subject_id===id;}).map(function(l){return "• "+l.title}).join("<br>"))||"لا دروس بعد";
      var hws=data.assignments||[];
      document.getElementById("hw-list").innerHTML=hws.length?hws.filter(function(a){return !a.subject_id||a.subject_id===id;}).map(function(a){
        return '<div class="card"><strong>'+a.title+'</strong><br><button type="button" style="margin-top:8px" onclick="Hassad.startQuiz && Hassad.startQuiz(\''+a.id+'\')">افتح النشاط</button></div>';
      }).join(""):"لا واجبات";
      document.getElementById("arch-list").innerHTML=(lives.filter(function(s){return s.recording_url;}).map(function(s){return "• "+s.title}).join("<br>"))||"لا تسجيلات بعد";
    }
    fill();
    HassadFB.init().then(function(){ return HassadFB.pull(); }).then(function(){ fill(); });
    function show(name,btn){
      ["live","lessons","arch","hw"].forEach(function(x){document.getElementById(x).hidden=x!==name;});
      document.querySelectorAll(".tabs button").forEach(function(b){b.className="";});
      btn.className="on";
    }
    function send(){
      var t=document.getElementById("chat-text"); if(!t.value.trim()) return;
      var b=document.createElement("div"); b.className="bubble"; b.textContent=t.value;
      t.parentNode.parentNode.insertBefore(b,t.parentNode); t.value="";
    }
  </script>
</body>
</html>
