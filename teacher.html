<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة المعلم | حَصاد</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Tahoma,sans-serif;background:#f4eee0;color:#1a2428;padding:16px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    h1{font-size:22px;color:#0e5160}
    button,input,select,textarea{font:inherit}
    .out{background:transparent;border:0;color:#0e5160;font-weight:800}
    .card{background:#fff;border:1px solid #e4d9bf;border-radius:18px;padding:16px;margin-bottom:14px}
    label{display:block;font-weight:700;margin:10px 0 6px;font-size:14px}
    input,select,textarea{width:100%;padding:11px;border:1px solid #d9d0bc;border-radius:12px;background:#fff}
    textarea{min-height:140px}
    .btn{width:100%;margin-top:12px;background:#0e5160;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800}
    .sbtn{background:#0e5160;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:800;margin-top:6px}
    .del{background:transparent;border:0;color:#b42318;font-weight:800;padding:4px 0}
    .slot{padding:10px 0;border-top:1px solid #eee3cc;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
    .muted{color:#5c6b70;font-size:13px;margin-bottom:10px}
    .q{background:#f7f1df;border-radius:12px;padding:10px;margin:8px 0}
    .ans{background:#e8f3f1;border-radius:10px;padding:8px;margin-top:6px}
    #hw-preview{max-width:100%;border-radius:12px;margin:8px 0;display:none}
  </style>
</head>
<body>
  <header>
    <h1 id="hi">لوحة المعلم</h1>
    <button class="out" type="button" onclick="localStorage.removeItem('hassad-user');location.href='login.html?as=teacher'">خروج</button>
  </header>
  <p class="muted" id="meta"></p>
  <p id="pub"></p>
  <div class="card">
    <h3>أسئلة طلاب صفوفك</h3>
    <div id="qs">لا أسئلة بعد</div>
  </div>
  <form class="card" id="lesson-form">
    <h3>إضافة درس</h3>
    <label>عنوان الدرس</label><input id="ls-title" required>
    <label>رابط أو ملاحظة</label><input id="ls-note">
    <button class="btn">نشر الدرس</button>
  </form>
  <form class="card" id="live-form">
    <h3 id="live-head">إضافة حصة / بث</h3>
    <p class="muted">يمكن نشر الموعد بدون رابط، ثم تعديل الحصة لإضافة رابط البث لاحقاً.</p>
    <input type="hidden" id="live-id">
    <label>لأي صف؟</label><select id="live-grade"></select>
    <label>العنوان</label><input id="live-title" required>
    <label>التاريخ</label><input id="live-date" type="date" required>
    <label>الوقت</label><input id="live-hour" type="time" required>
    <label>رابط البث (اختياري الآن)</label><input id="live-embed" dir="ltr" placeholder="أضفه لاحقاً عند بدء البث">
    <button class="btn" id="live-save">نشر الحصة</button>
    <button class="sbtn" type="button" onclick="clearLive()">حصة جديدة</button>
  </form>
  <form class="card" id="hw-form">
    <h3>واجب تفاعلي من صورة</h3>
    <label>لأي صف؟</label><select id="hw-grade"></select>
    <label>العنوان</label><input id="hw-title" required>
    <label>آخر موعد</label><input id="hw-due" type="date" required>
    <label>صورة الواجب</label><input id="hw-file" type="file" accept="image/*">
    <img id="hw-preview" alt="">
    <button class="sbtn" type="button" onclick="Hassad.convertImage()">حوّل الصورة إلى أسئلة</button>
    <p class="muted" id="convert-msg"></p>
    <label>الأسئلة</label>
    <textarea id="hw-questions"></textarea>
    <button class="btn">نشر الواجب للطلاب</button>
  </form>
  <div class="card"><h3>الحصص والبث</h3><div id="sched"></div></div>
  <div class="card"><h3>الواجبات</h3><div id="hwlist"></div></div>
  <div class="card"><h3>الدروس</h3><div id="lslst"></div></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=59"></script>
  <script src="js/fb.js?v=59"></script>
  <script src="js/quiz.js?v=59"></script>
  <script>window.Hassad=window.Hassad||{};</script>
  <script src="js/vision.js?v=59"></script>
  <script>
    var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    var u=null; try{u=JSON.parse(localStorage.getItem("hassad-user")||"null")}catch(e){}
    if(!u) location.href="login.html?as=teacher";
    else if(u.role==="admin") location.href="admin.html";
    else if(u.role!=="teacher") location.href="home.html";
    var myGrades=(u.grades&&u.grades.length)?u.grades:(u.grade?[u.grade]:[]);
    Hassad.toast=function(t){ say(true,t); };
    function fillSelects(){
      ["live-grade","hw-grade"].forEach(function(id){
        var el=document.getElementById(id); el.innerHTML="";
        myGrades.forEach(function(g){ var o=document.createElement("option"); o.textContent=g; o.value=g; el.appendChild(o); });
      });
    }
    fillSelects();
    document.getElementById("hw-file").onchange=function(){
      var f=this.files&&this.files[0]; if(!f) return;
      var r=new FileReader();
      r.onload=function(){ var img=document.getElementById("hw-preview"); img.src=r.result; img.style.display="block"; };
      r.readAsDataURL(f);
    };
    function digits(s){return String(s||"").replace(/[^0-9]/g,"");}
    function phoneMatch(a,b){ var x=digits(a), y=digits(b); return x&&y&&(x===y||x.slice(-8)===y.slice(-8)); }
    function cleanG(g){ return String(g||"").replace(/الصف\s*/g,"").replace(/\s+/g,"").trim(); }
    function teaches(g){
      if(!g || !myGrades.length) return false;
      var cg=cleanG(g);
      return myGrades.some(function(mg){ return mg===g || cleanG(mg)===cg; });
    }
    function db(){ var d={}; try{d=JSON.parse(localStorage.getItem("hassad-db")||"{}")}catch(e){} d.live_sessions=d.live_sessions||[]; d.assignments=d.assignments||[]; d.lessons=d.lessons||[]; return d; }
    function save(d){ localStorage.setItem("hassad-db", JSON.stringify(d)); }
    function say(ok,msg){ document.getElementById("pub").textContent=msg||""; }
    function yt(src){
      var m=String(src||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|live\/|shorts\/)|v=)([\w-]{11})/);
      return m ? "https://www.youtube.com/watch?v="+m[1] : String(src||"").trim();
    }
    function cloud(col,item){ return HassadFB.put(col, item.id, item).then(function(){ say(true,"وصل للطلاب: "+(item.title||"")); }).catch(function(e){ say(false,e&&e.message||"فشل"); }); }
    function when(date,hour){
      if(!date) return hour||"";
      var p=date.split("-").map(Number); var dt=new Date(p[0],p[1]-1,p[2]); var clock=hour||"";
      if(hour && hour.indexOf(":")>=0){ var hh=+hour.split(":")[0], mm=hour.split(":")[1]; var ap=hh>=12?"مساء":"صباح"; hh=hh%12||12; clock=hh+":"+mm+" "+ap; }
      return DAYS[dt.getDay()]+" "+p[2]+"/"+p[1]+" — "+clock;
    }
    function isoAt(date,hour){ return (!date||!hour)?"":date+"T"+hour+":00+04:00"; }
    function mine(list){
      return (list||[]).filter(function(s){
        if(s.subject_id && s.subject_id!=="math") return false;
        if(s.grade && !teaches(s.grade)) return false;
        return true;
      });
    }
    function drop(col,id){
      var d=db();
      if(col==="live_sessions") d.live_sessions=(d.live_sessions||[]).filter(function(x){return x.id!==id;});
      if(col==="assignments") d.assignments=(d.assignments||[]).filter(function(x){return x.id!==id;});
      if(col==="lessons") d.lessons=(d.lessons||[]).filter(function(x){return x.id!==id;});
      save(d);
      HassadFB.del(col,id).then(function(){ say(true,"حُذف"); draw(); });
    }
    function clearLive(){
      document.getElementById("live-id").value="";
      document.getElementById("live-title").value="";
      document.getElementById("live-embed").value="";
      document.getElementById("live-head").textContent="إضافة حصة / بث";
      document.getElementById("live-save").textContent="نشر الحصة";
    }
    function editLive(id){
      var s=(db().live_sessions||[]).find(function(x){return x.id===id;}); if(!s) return;
      document.getElementById("live-id").value=s.id;
      document.getElementById("live-title").value=s.title||"";
      document.getElementById("live-grade").value=s.grade||"";
      document.getElementById("live-embed").value=s.stream_url||"";
      if(s.scheduled_at && s.scheduled_at.indexOf("T")>0){
        document.getElementById("live-date").value=s.scheduled_at.slice(0,10);
        document.getElementById("live-hour").value=s.scheduled_at.slice(11,16);
      }
      document.getElementById("live-head").textContent="تعديل الحصة / إضافة الرابط";
      document.getElementById("live-save").textContent="حفظ التعديل";
      document.getElementById("live-form").scrollIntoView({behavior:"smooth"});
    }
    function draw(){
      document.getElementById("hi").textContent="مرحباً "+(u.name||"");
      document.getElementById("meta").textContent="الرياضيات · "+(myGrades.join(" · ")||"");
      var d=db();
      document.getElementById("sched").innerHTML=mine(d.live_sessions).map(function(s){
        return '<div class="slot"><span>'+s.title+' — '+(s.grade||"")+(s.stream_url?" · بث جاهز":" · بلا رابط")+'</span><span><button class="sbtn" type="button" onclick="editLive(\''+s.id+'\')">تعديل</button> <button class="del" type="button" onclick="drop(\'live_sessions\',\''+s.id+'\')">حذف</button></span></div>';
      }).join("")||'<div class="slot">لا حصص</div>';
      document.getElementById("hwlist").innerHTML=mine(d.assignments).map(function(s){
        return '<div class="slot"><span>'+s.title+' — '+((s.questions||[]).length)+' أسئلة</span><button class="del" type="button" onclick="drop(\'assignments\',\''+s.id+'\')">حذف</button></div>';
      }).join("")||'<div class="slot">لا واجبات</div>';
      document.getElementById("lslst").innerHTML=mine(d.lessons).map(function(s){
        return '<div class="slot"><span>'+s.title+'</span><button class="del" type="button" onclick="drop(\'lessons\',\''+s.id+'\')">حذف</button></div>';
      }).join("")||'<div class="slot">لا دروس</div>';
    }
    function applyCloudTeacher(t){
      var gs=(t.grades&&t.grades.length)?t.grades:(t.grade?[t.grade]:myGrades);
      myGrades=gs; u.grades=gs; u.grade=gs[0]||""; u.name=t.name||u.name;
      localStorage.setItem("hassad-user", JSON.stringify(u)); fillSelects(); draw();
    }
    function refreshTeacher(){
      if(!HassadFB.db) return Promise.resolve();
      return HassadFB.db.collection("teachers").get().then(function(snap){
        snap.forEach(function(doc){
          var t=Object.assign({id:doc.id}, doc.data());
          if(phoneMatch(t.phone||doc.id, u.phone||u.uid)) applyCloudTeacher(t);
        });
      });
    }
    function loadQs(){
      if(!HassadFB.db) return;
      HassadFB.db.collection("messages").get().then(function(snap){
        var rows=[];
        snap.forEach(function(doc){
          var m=Object.assign({id:doc.id}, doc.data()||{});
          if(m.subject_id && m.subject_id!=="math") return;
          if(!teaches(m.grade)) return;
          rows.push(m);
        });
        rows.sort(function(a,b){return (b.at||0)-(a.at||0);});
        document.getElementById("qs").innerHTML=rows.length?rows.map(function(m){
          return '<div class="q"><b>'+(m.name||"طالب")+'</b> · '+(m.grade||"")+'<div>'+(m.text||"")+'</div>'
            +(m.reply?'<div class="ans">ردك: '+m.reply+'</div>':'')
            +'<input id="r_'+m.id+'" placeholder="الرد">'
            +'<button class="sbtn" type="button" onclick="replyMsg(\''+m.id+'\')">رد</button> '
            +'<button class="del" type="button" onclick="delMsg(\''+m.id+'\')">حذف</button></div>';
        }).join(""):"لا أسئلة من صفوفك";
      });
    }
    function replyMsg(id){
      var inp=document.getElementById("r_"+id); var text=inp&&inp.value.trim(); if(!text) return;
      HassadFB.put("messages", id, {reply:text, replyBy:u.name||"المعلم", replyAt:Date.now()}).then(loadQs);
    }
    function delMsg(id){ HassadFB.del("messages", id).then(loadQs); }
    document.getElementById("live-form").onsubmit=function(e){
      e.preventDefault();
      var date=document.getElementById("live-date").value, hour=document.getElementById("live-hour").value;
      var id=document.getElementById("live-id").value || ("l"+Date.now());
      var item={id:id,title:document.getElementById("live-title").value,subject_id:"math",grade:document.getElementById("live-grade").value,stream_url:yt(document.getElementById("live-embed").value),scheduled_time:when(date,hour),scheduled_at:isoAt(date,hour),status:"live",teacher:u.name||""};
      var d=db();
      var i=(d.live_sessions||[]).findIndex(function(x){return x.id===id;});
      if(i>=0) d.live_sessions[i]=Object.assign({}, d.live_sessions[i], item);
      else d.live_sessions.unshift(item);
      save(d); cloud("live_sessions", item); draw(); clearLive();
    };
    document.getElementById("hw-form").onsubmit=function(e){
      e.preventDefault();
      var questions=typeof parseQuestions==="function"?parseQuestions(document.getElementById("hw-questions").value):[];
      var item={id:"a"+Date.now(),subject_id:"math",grade:document.getElementById("hw-grade").value,title:document.getElementById("hw-title").value.trim(),due_date:document.getElementById("hw-due").value,questions:questions,points_each:10,teacher:u.name||""};
      var d=db(); d.assignments.unshift(item); save(d); cloud("assignments", item); draw();
    };
    document.getElementById("lesson-form").onsubmit=function(e){
      e.preventDefault();
      var item={id:"ls"+Date.now(),subject_id:"math",grade:document.getElementById("live-grade").value||myGrades[0]||"",title:document.getElementById("ls-title").value.trim(),note:document.getElementById("ls-note").value.trim(),teacher:u.name||""};
      var d=db(); d.lessons.unshift(item); save(d); cloud("lessons", item); e.target.reset(); draw();
    };
    draw();
    HassadFB.init().then(function(){ return HassadFB.pull(); }).then(function(){
      if(HassadFB.db) HassadFB.db.collection("settings").doc("app").get().then(function(doc){
        var k=doc.exists && doc.data() && doc.data().xaiKey;
        if(k) localStorage.setItem("hassad-xai-key", k);
      });
      return refreshTeacher();
    }).then(function(){ draw(); loadQs(); setInterval(function(){ refreshTeacher(); loadQs(); },15000); });
  </script>
</body>
</html>
