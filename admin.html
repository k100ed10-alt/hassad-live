<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة | حَصاد</title>
  <link rel="stylesheet" href="css/style.css?v=26" />
  <link rel="icon" href="assets/logo.svg">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="admin.html" style="color:#ead9a0">حَصاد · إدارة</a>
      <nav class="side-nav">
        <a class="active" href="admin.html">اللوحة</a>
        <a href="#" onclick="Hassad.logout()">خروج</a>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar"><h1>لوحة التحكم</h1></div>
      <form class="card" style="margin-bottom:16px" onsubmit="Hassad.createTeacher(event)">
        <h3>إنشاء معلم</h3>
        <div class="grid-2">
          <div class="field"><label>الاسم</label><input id="tc-name" required></div>
          <div class="field"><label>البريد</label><input id="tc-email" type="email" required></div>
          <div class="field"><label>المادة</label><select id="tc-subject"></select></div>
          <div class="field"><label>الصف</label><select id="tc-grade"></select></div>
        </div>
        <button class="btn">حفظ</button>
        <p class="hint" id="tc-msg"></p>
      </form>
      <form class="card" style="margin-bottom:16px" onsubmit="Hassad.createStudent(event)">
        <h3>طالب واحد</h3>
        <div class="grid-2">
          <div class="field"><label>الاسم</label><input id="st-name" required></div>
          <div class="field"><label>الصف</label><select id="st-grade" required></select></div>
          <div class="field"><label>رقم الهاتف</label><input id="st-phone" required inputmode="tel" placeholder="9689xxxxxxx"></div>
        </div>
        <button class="btn">حفظ وولّد الكلمة</button>
        <p class="hint" id="new-cred"></p>
      </form>
      <div class="grid-2">
        <form class="card" onsubmit="Hassad.saveLive(event)">
          <h3>الحصة</h3>
          <div class="field"><label>المادة</label><select id="live-form-subject"></select></div>
          <div class="field"><label>الصف</label><select id="live-grade"></select></div>
          <div class="field"><label>العنوان</label><input id="live-title" required></div>
          <div class="field"><label>التاريخ</label><input id="live-date" type="date" required></div>
          <div class="field"><label>الوقت</label><input id="live-hour" type="time" required></div>
          <div class="field"><label>رابط البث</label><input id="live-embed" dir="ltr"></div>
          <button class="btn">نشر</button>
        </form>
        <form class="card" onsubmit="Hassad.saveHw(event)">
          <h3>الواجب</h3>
          <div class="field"><label>المادة</label><select id="hw-subject"></select></div>
          <div class="field"><label>الصف</label><select id="hw-grade"></select></div>
          <div class="field"><label>العنوان</label><input id="hw-title" required></div>
          <div class="field"><label>آخر موعد</label><input id="hw-due" type="date" required></div>
          <button class="btn">نشر</button>
        </form>
      </div>
      <section class="card" style="margin-top:16px">
        <h3>الطلاب حسب الصف</h3>
        <div class="field"><label>اختر الصف</label>
          <select id="view-grade" onchange="Hassad.renderAdmin()"></select>
        </div>
        <p class="hint" id="grade-count"></p>
        <table class="table"><thead><tr><th>الاسم</th><th>الهاتف</th><th>البريد</th><th>كلمة المرور</th></tr></thead><tbody id="students"></tbody></table>
      </section>
      <section class="card" style="margin-top:16px">
        <h3>الحصص</h3>
        <table class="table"><thead><tr><th>المادة</th><th>العنوان</th><th>الوقت</th><th>الرابط</th></tr></thead><tbody id="live-table"></tbody></table>
      </section>
      <section class="card" style="margin-top:16px">
        <h3>الواجبات</h3>
        <div class="list" id="admin-hw"></div>
      </section>
    </main>
  </div>
  <script src="js/app.js?v=26"></script>
  <script src="js/roles.js?v=26"></script>
  <script src="js/grade-filter.js?v=26"></script>
  <script>
    var grades=["الصف الخامس","الصف السادس","الصف السابع","الصف الثامن","الصف التاسع","الصف العاشر","الصف الحادي عشر","الصف الثاني عشر"];
    ["tc-grade","view-grade"].forEach(function(id){
      var el=document.getElementById(id); if(!el||el.options.length) return;
      grades.forEach(function(g){var o=document.createElement("option");o.textContent=g;el.appendChild(o)});
    });
    var ts=document.getElementById("tc-subject");
    if(ts && !ts.options.length){
      [["math","الرياضيات"],["islamic","الإسلامية"],["arabic","العربية"],["science","العلوم"]].forEach(function(p){var o=document.createElement("option");o.value=p[0];o.textContent=p[1];ts.appendChild(o)});
    }
    if(typeof fillGradeSelects==="function") fillGradeSelects();
    if(Hassad.renderAdmin) Hassad.renderAdmin();
  </script>
</body>
</html>
